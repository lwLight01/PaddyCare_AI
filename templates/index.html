<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>PaddyCare AI – ধান রোগ সনাক্তকরণ</title>
  <meta name="description" content="AI দিয়ে ধান পাতার রোগ সনাক্ত করুন এবং চিকিৎসার পরামর্শ পান।" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!--HEADER-->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">🌾</span>
      <div>
        <h1 class="logo-title">PaddyCare AI</h1>
        <p class="logo-sub">ধান রোগ সনাক্তকরণ সিস্টেম</p>
      </div>
    </div>
    <button class="btn-history-toggle" id="btnHistoryToggle" onclick="toggleHistoryPanel()">
      📋 ইতিহাস
    </button>
  </div>
</header>

<!--MAIN-->
<main class="main-container">

  <!--Upload Card-->
  <section class="card upload-card" id="uploadCard">
    <h2 class="card-title">📸 ছবি আপলোড করুন</h2>
    <p class="card-hint">ধান পাতার স্পষ্ট ছবি তুলুন অথবা গ্যালারি থেকে বেছে নিন</p>

    <!-- Image Preview -->
    <div class="preview-box" id="previewBox" onclick="document.getElementById('fileInput').click()">
      <img id="previewImg" src="" alt="" style="display:none;" />
      <div class="preview-placeholder" id="previewPlaceholder">
        <span class="preview-icon">🌿</span>
        <p>ছবি দেখতে এখানে ট্যাপ করুন</p>
      </div>
      <div class="scan-line" id="scanLine"></div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-row">
      <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">
        📁 গ্যালারি
      </button>
      <button class="btn btn-camera" onclick="document.getElementById('cameraInput').click()">
        📷 ক্যামেরা
      </button>
    </div>

    <!-- Hidden inputs -->
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)" />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFile(this)" />

    <!-- Analyse Button -->
    <button class="btn btn-analyse" id="btnAnalyse" onclick="analyseImage()" disabled>
      🔍 রোগ সনাক্ত করুন
    </button>

    <!-- Loading Spinner -->
    <div class="spinner-wrap" id="spinnerWrap" style="display:none;">
      <div class="spinner"></div>
      <p class="spinner-text">বিশ্লেষণ চলছে...</p>
    </div>
  </section>

  <!-- ── Warning Box ── -->
  <div class="warning-box" id="warningBox" style="display:none;">
    <span class="warning-icon">⚠️</span>
    <p id="warningMsg"></p>
  </div>

  <!-- ── Results Card ── -->
  <section class="card result-card" id="resultCard" style="display:none;">
    <h2 class="card-title">📊 ফলাফল</h2>

    <div class="uploaded-preview">
      <img id="resultImg" src="" alt="Analysed leaf" />
    </div>

    <div id="predictionsContainer"></div>
  </section>

</main>

<!-- ═══════════════════════ HISTORY PANEL ═══════════════════════ -->
<aside class="history-panel" id="historyPanel">
  <div class="history-header">
    <h3>📋 বিশ্লেষণের ইতিহাস</h3>
    <button class="btn-close" onclick="toggleHistoryPanel()">✕</button>
  </div>
  <button class="btn btn-clear-history" onclick="clearHistory()">🗑️ ইতিহাস মুছুন</button>
  <div id="historyList" class="history-list">
    <p class="empty-state">কোনো ইতিহাস নেই।</p>
  </div>
</aside>
<div class="history-overlay" id="historyOverlay" onclick="toggleHistoryPanel()"></div>

<!-- ═══════════════════════ SCRIPTS ═══════════════════════ -->
<script>
  /* ─── State ──────────────────────────────────────────────── */
  let selectedFile = null;

  /* ─── File handler ──────────────────────────────────────── */
  function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    selectedFile = file;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.getElementById("previewImg");
      img.src = e.target.result;
      img.style.display = "block";
      document.getElementById("previewPlaceholder").style.display = "none";
      document.getElementById("btnAnalyse").disabled = false;
    };
    reader.readAsDataURL(file);

    // Reset previous results
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("warningBox").style.display = "none";
  }

  /* ─── Analyse ────────────────────────────────────────────── */
  async function analyseImage() {
    if (!selectedFile) return;

    setLoading(true);
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("warningBox").style.display = "none";

    const form = new FormData();
    form.append("file", selectedFile);
    form.append("lang", "bn");

    try {
      const res  = await fetch("/predict", { method: "POST", body: form });
      const data = await res.json();
      setLoading(false);
      renderResult(data);
    } catch (err) {
      setLoading(false);
      showWarning("সার্ভার সংযোগে সমস্যা। অনুগ্রহ করে আবার চেষ্টা করুন।");
    }
  }

  /* ─── Render result ──────────────────────────────────────── */
  function renderResult(data) {
    if (data.status === "error") {
      showWarning(data.message);
      return;
    }

    if (data.status === "warning") {
      showWarning(data.message);
      return;
    }

    // Show result card
    const resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";
    document.getElementById("resultImg").src = data.image_url;

    const container = document.getElementById("predictionsContainer");
    container.innerHTML = "";

    data.predictions.forEach((pred, index) => {
      const isTop = index === 0;
      const severityClass = pred.confidence >= 70 ? "high" : pred.confidence >= 40 ? "medium" : "low";

      const block = document.createElement("div");
      block.className = `disease-block ${isTop ? "disease-top" : "disease-second"}`;
      block.innerHTML = `
        <div class="disease-header">
          <span class="rank-badge">#${index + 1}</span>
          <span class="disease-name">${banglaDiseaseName(pred.disease)}</span>
          <span class="confidence-badge severity-${severityClass}">${pred.confidence}%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar severity-bg-${severityClass}" style="width:${pred.confidence}%"></div>
        </div>
        <details class="treatment-details">
          <summary>💊 চিকিৎসার পরামর্শ দেখুন</summary>
          <div class="treatment-text">${pred.treatment.replace(/\n/g, "<br/>")}</div>
        </details>
      `;
      container.appendChild(block);
    });

    // Scroll to results
    resultCard.scrollIntoView({ behavior: "smooth", block: "start" });

    // Reload history
    loadHistory();
  }

  /* ─── Bangla disease name mapping ───────────────────────── */
  function banglaDiseaseName(name) {
    const map = {
      "Blast": "ব্লাস্ট রোগ",
      "Brown Spot": "বাদামী দাগ রোগ",
      "Bacterial Blight": "ব্যাকটেরিয়াল ব্লাইট",
      "Healthy": "সুস্থ গাছ ✅",
    };
    return map[name] || name;
  }

  /* ─── Warning ────────────────────────────────────────────── */
  function showWarning(msg) {
    const box = document.getElementById("warningBox");
    document.getElementById("warningMsg").innerHTML = msg.replace(/\n/g, "<br/>");
    box.style.display = "flex";
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  /* ─── Loading ────────────────────────────────────────────── */
  function setLoading(active) {
    document.getElementById("spinnerWrap").style.display = active ? "flex" : "none";
    document.getElementById("btnAnalyse").disabled = active;
    
    // Toggle scanning animation
    const scanLine = document.getElementById("scanLine");
    if (active) {
      scanLine.style.display = "block";
    } else {
      scanLine.style.display = "none";
    }
  }

  /* ═══════════════════════════════════════════════════════════
     HISTORY
  ═══════════════════════════════════════════════════════════ */
  function toggleHistoryPanel() {
    const panel   = document.getElementById("historyPanel");
    const overlay = document.getElementById("historyOverlay");
    const isOpen  = panel.classList.contains("open");
    panel.classList.toggle("open", !isOpen);
    overlay.classList.toggle("active", !isOpen);
    if (!isOpen) loadHistory();
  }

  async function loadHistory() {
    try {
      const res     = await fetch("/history");
      const records = await res.json();
      renderHistory(records);
    } catch (_) {}
  }

  function renderHistory(records) {
    const list = document.getElementById("historyList");
    if (!records.length) {
      list.innerHTML = '<p class="empty-state">কোনো ইতিহাস নেই।</p>';
      return;
    }

    list.innerHTML = records.map(rec => {
      if (rec.status === "warning" || rec.status === "error") {
        return `
          <div class="history-item warning-item">
            <span class="history-time">${rec.timestamp || ""}</span>
            <p class="history-warning">⚠️ অজানা ছবি</p>
          </div>`;
      }
      const top = rec.predictions[0];
      return `
        <div class="history-item" onclick="showHistoryDetail(${JSON.stringify(JSON.stringify(rec)).slice(1,-1)})">
          <img class="history-thumb" src="${rec.image_url}" alt="" onerror="this.style.display='none'" />
          <div class="history-info">
            <p class="history-disease">${banglaDiseaseName(top.disease)}</p>
            <p class="history-conf">${top.confidence}% নিশ্চিত</p>
            <span class="history-time">${rec.timestamp || ""}</span>
          </div>
        </div>`;
    }).join("");
  }

  function showHistoryDetail(jsonStr) {
    try {
      const rec = JSON.parse(jsonStr);
      renderResult(rec);
      toggleHistoryPanel();
    } catch (_) {}
  }

  async function clearHistory() {
    if (!confirm("সব ইতিহাস মুছে ফেলতে চান?")) return;
    await fetch("/history", { method: "DELETE" });
    loadHistory();
  }

  /* ─── Init ───────────────────────────────────────────────── */
  loadHistory();
</script>
</body>
</html>
